# "Desi Toon" Shorts (AI comic-illustration style) for GoodFoodGoodMood, in two phases on one branch toon/<name>:
#  1. BUILD: the daily Claude scheduled task pushes toon/<name> (made from main) with toon_job/job.json.
#     This workflow generates the images (free Pollinations / Flux; kept in toon_job/images/ for re-builds), the Hindi voice
#     (edge-tts), captions, banner + step counter and music, renders the MP4 and commits it with review frames to
#     toon_build/ on the same branch. Nothing is uploaded.
#  2. PUBLISH: after looking at toon_build/review/, the task pushes toon_job/APPROVED to the branch. This workflow then
#     uploads toon_build/*.mp4 with the channel-guarded uploader, records toon/results/<name>.json + the shared topic log
#     line on main, and deletes the branch.
#  To fix a scene: delete toon_job/images/<NN>.jpg (+ adjust its prompt/seed in job.json), delete toon_build/, push: phase 1 re-runs.
name: Build + publish Desi Toon Short

on:
  push:
    branches: ["toon/**"]
  workflow_dispatch:
    inputs:
      branch:
        description: "toon/<name> branch to (re)run"
        required: true

permissions:
  contents: write

concurrency:
  group: toon-${{ github.ref_name || inputs.branch }}
  cancel-in-progress: false

jobs:
  toon:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BRANCH: ${{ inputs.branch || github.ref_name }}
    steps:
      - name: Check out main (builder + log)
        uses: actions/checkout@v4
        with: { ref: main, path: main }

      - name: Check out the toon branch
        uses: actions/checkout@v4
        with: { ref: "${{ env.BRANCH }}", path: branch }

      - name: Which phase?
        id: guard
        run: |
          name="${BRANCH#toon/}"; echo "name=$name" >> "$GITHUB_OUTPUT"
          test -f branch/toon_job/job.json
          if [ -f "main/toon/results/$name.json" ]; then
            echo "Already published:"; cat "main/toon/results/$name.json"; echo "phase=done" >> "$GITHUB_OUTPUT"
          elif [ -f branch/toon_job/APPROVED ] && ls branch/toon_build/*.mp4 >/dev/null 2>&1; then
            echo "phase=publish" >> "$GITHUB_OUTPUT"
          elif ls branch/toon_build/*.mp4 >/dev/null 2>&1; then
            echo "Built and waiting for review (push toon_job/APPROVED to publish)"; echo "phase=done" >> "$GITHUB_OUTPUT"
          else echo "phase=build" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.phase != 'done'
        with: { python-version: "3.12" }

      # ── phase 1: build ──
      - name: Install tools
        if: steps.guard.outputs.phase == 'build'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q "edge-tts>=7.2.0,<8" requests Pillow numpy scipy

      - name: Build the video (images + voice + captions + music)
        if: steps.guard.outputs.phase == 'build'
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python main/toon/build.py branch/toon_job/job.json branch/toon_build
          ffprobe -v error -show_entries format=duration:stream=width,height,codec_type -of compact branch/toon_build/*.mp4 | tee branch/toon_build/probe.txt

      - name: Commit the build (or the images made so far) to the branch for review
        if: always() && steps.guard.outputs.phase == 'build'
        run: |
          cd branch
          git config user.name "shorts-bot"; git config user.email "shorts-bot@users.noreply.github.com"
          git add -A toon_job/images toon_build 2>/dev/null || true
          git commit -m "toon build for review: ${BRANCH#toon/}" || { echo "nothing to commit"; exit 0; }
          git push origin "HEAD:$BRANCH"

      # ── phase 2: publish ──
      - name: Upload to YouTube
        if: steps.guard.outputs.phase == 'publish'
        id: yt
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          EXPECTED_CHANNEL_ID: UC_ShLTZzCGP-nAmO-yqDRRw
        run: |
          if [ -z "$GOOGLE_CREDENTIALS" ]; then echo "::error::Secret GOOGLE_CREDENTIALS is missing (run reauth_youtube.py)"; exit 1; fi
          pip install -q google-api-python-client google-auth
          mkdir -p up && cp branch/toon_build/*.mp4 branch/toon_build/metadata.json up/
          python main/scripts/upload_youtube.py up

      - name: Record the result on main
        if: steps.guard.outputs.phase == 'publish'
        env:
          NAME: ${{ steps.guard.outputs.name }}
          URL: ${{ steps.yt.outputs.url }}
        run: |
          cd main
          mkdir -p toon/results
          python - <<'PY'
          import json, os, datetime
          m = json.load(open('../branch/toon_build/metadata.json'))
          name, url = os.environ['NAME'], os.environ['URL']
          d = datetime.datetime.utcnow().strftime('%Y-%m-%d')
          json.dump({'name': name, 'url': url, 'title': m['title'], 'privacy': m.get('privacy', 'public'), 'date': d,
                     'music': m.get('music', ''), 'style': m.get('style', 'desi-toon')},
                    open(f'toon/results/{name}.json', 'w'), indent=1, ensure_ascii=False)
          if m.get('privacy', 'public') == 'public':
              open('foodscience/_published.md', 'a', encoding='utf-8').write(f"- {d} | {m.get('topic','')} | {m.get('style','desi-toon')} | {m['title']} | {url}\n")
          PY
          git config user.name "shorts-bot"; git config user.email "shorts-bot@users.noreply.github.com"
          git add -A && git commit -m "toon published: $NAME $URL"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done

      - name: Delete the toon branch
        if: success() && steps.guard.outputs.phase == 'publish'
        run: git -C main push origin --delete "$BRANCH" || true
